<div class="reveal-burst" aria-hidden="true">
  @for (angle of sparkAngles; track $index) {
    <span class="reveal-spark" [style.--spark-angle]="angle + 'deg'"></span>
  }
</div>
@if (vegas()) {
  <div class="vegas-reveal-banner" aria-hidden="true">
    <span>The cards are in</span>
  </div>
}
@if (graveyard()) {
  <div class="graveyard-flash" aria-hidden="true"></div>
  <div class="graveyard-reveal-banner" aria-hidden="true">
    <span>The votes have risen</span>
  </div>
}
@if (harvest()) {
  <div class="harvest-steam" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="harvest-reveal-banner" aria-hidden="true">
    <span>Dinner is served</span>
  </div>
}
