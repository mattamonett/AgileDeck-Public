name: poker

services:
  api:
    cpu_shares: 2048
    image: poker-api:${POKER_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        - BUILD_TIME=${BUILD_TIME:-Development}
    restart: unless-stopped
    # No port is published: browsers reach the API through the web container's proxy.
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/api/data/poker.db
      - COOKIE_SIGNING_SECRET=${COOKIE_SIGNING_SECRET:?Set COOKIE_SIGNING_SECRET before starting production containers}
      - COOKIE_SIGNING_SECRET_PREVIOUS=${COOKIE_SIGNING_SECRET_PREVIOUS:-}
      # Used when access.passwordProtects in config/site.json is not "nothing".
      - SITE_PASSWORD=${SITE_PASSWORD:-}
      # Turns on the admin page at /admin; empty leaves it off.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ALLOW_MISSING_SOCKET_ORIGIN=${ALLOW_MISSING_SOCKET_ORIGIN:-false}
      # Only the web container (fixed address below) may report client addresses.
      # Add any reverse proxy in front of it, comma separated; see docs/self-hosting.md.
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-172.30.0.10}
      - POKER_FRONTEND_URL=${POKER_FRONTEND_URL:-http://localhost:8080}
      # Secure cookies follow the address: on for https, off for http.
      - COOKIE_SECURE=${COOKIE_SECURE:-}
    networks:
      - poker
    volumes:
      - poker_data:/app/api/data
      - ./config:/app/config:ro
    init: true
    stop_grace_period: 15s
    read_only: true
    pids_limit: 100
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/',{headers:{Origin:process.env.POKER_FRONTEND_URL.split(',')[0]}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1024M
          pids: 100
          cpus: '2'

  web:
    cpu_shares: 1024
    image: poker-web:${POKER_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        - BUILD_TIME=${BUILD_TIME:-Development}
    restart: unless-stopped
    # Publish on all interfaces with WEB_BIND=0.0.0.0, or keep the default and
    # put a TLS reverse proxy in front (see docs/self-hosting.md).
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080'
    networks:
      poker:
        ipv4_address: 172.30.0.10
    depends_on:
      api:
        condition: service_healthy
    pids_limit: 64
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 64M
          pids: 64
          cpus: '0.5'

networks:
  poker:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  poker_data:
