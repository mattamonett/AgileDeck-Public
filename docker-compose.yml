name: poker

services:
  api:
    cpu_shares: 2048
    image: poker-api:${POKER_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        - BUILD_TIME=${BUILD_TIME:-Development}
    restart: unless-stopped
    # No port is published: browsers reach the API through the web container's proxy.
    environment:
      - NODE_ENV=production
      # docker/nginx.conf and the healthcheck below expect 3000; change all three together.
      - PORT=3000
      - DATABASE_URL=file:/app/api/data/poker.db
      # Empty: the API generates a secret on first start and keeps it in the data volume.
      - COOKIE_SIGNING_SECRET=${COOKIE_SIGNING_SECRET:-}
      - COOKIE_SIGNING_SECRET_FILE=/app/api/data/cookie-signing-secret
      - COOKIE_SIGNING_SECRET_PREVIOUS=${COOKIE_SIGNING_SECRET_PREVIOUS:-}
      # Used when access.passwordProtects in config/site.json is not "nothing".
      - SITE_PASSWORD=${SITE_PASSWORD:-}
      # Turns on the admin page at /admin; empty leaves it off.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ALLOW_MISSING_SOCKET_ORIGIN=${ALLOW_MISSING_SOCKET_ORIGIN:-false}
      # Only the web and caddy containers (POKER_WEB_IP, POKER_CADDY_IP) may report client
      # addresses. Add any reverse proxy in front of them, comma separated; see docs/self-hosting.md.
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-${POKER_WEB_IP:-172.30.0.10},${POKER_CADDY_IP:-172.30.0.20}}
      # https://DOMAIN when DOMAIN is set, otherwise http://localhost:8080.
      - POKER_FRONTEND_URL=${POKER_FRONTEND_URL:-${DOMAIN:+https://}${DOMAIN:-http://localhost:8080}}
      # Secure cookies follow the address: on for https, off for http.
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-text}
    networks:
      - poker
    volumes:
      - poker_data:/app/api/data
      - ./config:/app/config:ro
    init: true
    stop_grace_period: 15s
    read_only: true
    pids_limit: 100
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/',{headers:{Origin:process.env.POKER_FRONTEND_URL.split(',')[0]}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1024M
          pids: 100
          cpus: '2'

  web:
    cpu_shares: 1024
    image: poker-web:${POKER_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        - BUILD_TIME=${BUILD_TIME:-Development}
    restart: unless-stopped
    # Publish on all interfaces with WEB_BIND=0.0.0.0, or keep the default and
    # put a TLS reverse proxy in front (see docs/self-hosting.md).
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080'
    networks:
      poker:
        # Change POKER_SUBNET, POKER_WEB_IP and POKER_CADDY_IP together if 172.30.0.0/24 is taken.
        ipv4_address: ${POKER_WEB_IP:-172.30.0.10}
    depends_on:
      api:
        condition: service_healthy
    pids_limit: 64
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 64M
          pids: 64
          cpus: '0.5'

  # Optional HTTPS in front of web, turned on with COMPOSE_PROFILES=https and DOMAIN.
  caddy:
    image: caddy:2.10-alpine
    profiles: ['https']
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'test -n "$$DOMAIN" || { echo "Set DOMAIN in .env to the name visitors use, for example poker.example.com" >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    environment:
      - DOMAIN=${DOMAIN:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    networks:
      poker:
        ipv4_address: ${POKER_CADDY_IP:-172.30.0.20}
    depends_on:
      - web
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    # Caddy runs as the image's root user so it can write certificates to its
    # volumes; binding ports 80 and 443 is the only privilege it keeps.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 64
          cpus: '0.5'

networks:
  poker:
    ipam:
      config:
        - subnet: ${POKER_SUBNET:-172.30.0.0/24}

volumes:
  poker_data:
  caddy_data:
  caddy_config:
