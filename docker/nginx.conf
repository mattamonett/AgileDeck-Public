map $uri $cache_control {
    default "";
    ~*(\.html|version\.json|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    # Matches the largest API body (an issue import); the API enforces its own limits.
    client_max_body_size 2m;
    # Headers are inherited only while no location block declares its own add_header.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    # The API is proxied on this origin, so 'self' covers its HTTP and WebSocket traffic.
    # Angular injects component styles at runtime, which requires inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    location / {
        try_files $uri $uri/ /index.html;
    }
    # "api" is the Compose service name, looked up through Docker's DNS when a
    # request arrives so the image builds and starts without the API running.
    # The API adds its own security headers and reads the client address from
    # X-Forwarded-For only when this proxy is listed in TRUSTED_PROXY_IPS.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:3000;
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /socket.io/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
